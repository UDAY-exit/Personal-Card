<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Cards</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: gilroy;
        }

        html,body{
            width: 100%;
            min-height: 100%;
        }

        body{
            display: flex;
            justify-content: center;
            background: linear-gradient(135deg,#141e30,#243b55);
            padding: 40px 0;
        }

        #main{
            width: 350px;
            padding: 25px;
            border-radius: 20px;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(10px);
            box-shadow: 0 0 30px rgba(0,0,0,0.3);

            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        form{
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input{
            padding: 14px 18px;
            border: none;
            outline: none;
            border-radius: 12px;
            font-size: 15px;
            background-color: rgba(255,255,255,0.12);
            color: white;
            transition: all ease 0.3s;
        }

        input::placeholder{
            color: rgba(255,255,255,0.7);
        }

        input:focus{
            background-color: rgba(255,255,255,0.2);
            transform: scale(1.03);
        }

        input[type="submit"]{
            background: linear-gradient(to right,#00c6ff,#0072ff);
            cursor: pointer;
            font-weight: 600;
            letter-spacing: 1px;
        }

        input[type="submit"]:hover{
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(0,114,255,0.5);
        }

        .card{
            width: 100%;
            padding: 25px;
            border-radius: 18px;
            background-color: white;
            text-align: center;
            transition: all ease 0.3s;
        }

        .card:hover{
            transform: translateY(-8px);
        }

        .profile{
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .profile img{
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #0072ff;
            box-shadow: 0 0 20px rgba(0,114,255,0.4);
        }

        h2{
            margin-top: 15px;
            font-size: 28px;
            color: #222;
        }

        h4{
            margin-top: 5px;
            color: #0072ff;
            font-size: 14px;
        }

        p{
            margin-top: 10px;
            font-size: 13px;
            color: #666;
            line-height: 20px;
        }

    </style>
</head>

<body>

    <div id="main">

        <form>

            <input id="imginp" type="text" placeholder="Image URL">
            <input id="nameinp" type="text" placeholder="Name">
            <input id="jobinp" type="text" placeholder="Profession">
            <input id="infoinp" type="text" placeholder="Info">
            <input type="submit">

        </form>

    </div>

  <script src="PC.js"></script>

</body>
</html>
